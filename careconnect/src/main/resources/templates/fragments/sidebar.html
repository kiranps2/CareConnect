<aside th:fragment="sidebar(activePage)" class="sidebar">
    <aside class="sidebar">
    <div class="brand">
        <div class="brand-icon">
            <i class="bi bi-heart-pulse-fill"></i>
        </div>
        <span class="brand-text">CareConnect</span>
    </div>

    <div class="nav-label">Main Menu</div>

    <nav>
        <a class="nav-link" th:href="@{/}" th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
            <i class="bi bi-grid"></i>
            <span>Dashboard</span>
        </a>

        <a class="nav-link" th:href="@{/appointments}" th:classappend="${activePage == 'appointments'} ? ' active' : ''">
            <i class="bi bi-calendar-check"></i>
            <span>Appointments</span>
        </a>

        <a class="nav-link" th:href="@{/doctors}" th:classappend="${activePage == 'doctors'} ? ' active' : ''">
            <i class="bi bi-person-badge"></i>
            <span>Doctors</span>
        </a>

        <a class="nav-link" th:href="@{/patients}" th:classappend="${activePage == 'patients'} ? ' active' : ''">
            <i class="bi bi-people"></i>
            <span>Patients</span>
        </a>

        <a class="nav-link" th:href="@{/reports}" th:classappend="${activePage == 'reports'} ? ' active' : ''">
            <i class="bi bi-bar-chart-line"></i>
            <span>Reports</span>
        </a>
    </nav>

    <div class="nav-label">Account</div>

    <nav>
        <a class="nav-link" th:href="@{/settings}" th:classappend="${activePage == 'settings'} ? ' active' : ''">
            <i class="bi bi-gear"></i>
            <span>Settings</span>
        </a>

        <a class="nav-link" th:href="@{/logout}">
            <i class="bi bi-box-arrow-right"></i>
            <span>Logout</span>
        </a>
    </nav>
</aside>

</aside>
